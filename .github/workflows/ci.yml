name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check docs/ is up to date
        run: |
          git add -A docs
          git diff --cached --stat --exit-code docs || echo "::warning::docs/ differs from committed build output. Run npm run build and commit docs/."
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs
